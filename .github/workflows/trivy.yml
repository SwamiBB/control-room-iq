name: trivy
# Dependency, secret and misconfiguration scanning (Python and npm lockfiles, Dockerfiles, Bicep) with Trivy.
# Results are uploaded to Security > Code scanning. Report-only for now: it doesn't fail the build, so known
# findings are triaged there instead of blocking every PR.
#
# Supply chain: in March 2026 most trivy-action tags were repointed at code that stole CI secrets
# (CVE-2026-33634). So this job pins every action to a full commit SHA, asks for read-only repository access,
# and has no secrets or Azure credentials at all.
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Trivy reads ARM templates, not Bicep, so compile the infrastructure first (no Azure login needed).
      - name: Compile Bicep to ARM for the misconfiguration scan
        run: |
          mkdir -p .trivy-arm
          az bicep build --file infra/main.bicep --outfile .trivy-arm/main.json
      - name: Trivy scan (dependencies, secrets, misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, immutable release
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
