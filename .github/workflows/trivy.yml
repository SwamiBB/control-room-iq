name: trivy
# Vulnerability, secret and misconfiguration scanning with Trivy; results go to Security > Code scanning.
#   scan:   Python dependencies (resolved from pyproject), web/package-lock.json, leaked secrets, Dockerfiles,
#           and every infra module compiled from Bicep to ARM (Trivy doesn't read Bicep).
#   images: the three container images as built for Azure, base OS packages included.
# Report-only for now: known findings are triaged in the Security tab instead of blocking every PR.
#
# Supply chain: in March 2026 most trivy-action tags were repointed at code that stole CI secrets
# (CVE-2026-33634). Every action here is pinned to a full commit SHA, every tool to an exact version, jobs get
# read-only repository access plus security-events, and there are no secrets or Azure credentials.
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TRIVY_VERSION: v0.75.0
  BICEP_VERSION: v0.48.1
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # pyproject.toml has ranges, not a lockfile, so resolve the dependencies the images install and scan those.
      - name: Resolve Python dependencies for the scan
        run: |
          python -m pip install --quiet .
          mkdir -p .trivy-scan
          python -m pip freeze --exclude-editable | grep -v '^control-room-iq' > .trivy-scan/requirements.txt
      # Each module on its own: main.bicep is subscription-scoped and nests them, which Trivy may not expand.
      # A compile failure skips only the infrastructure scan, not the rest.
      - name: Compile infra modules to ARM
        continue-on-error: true
        run: |
          az bicep install --version "$BICEP_VERSION"
          for f in infra/modules/*.bicep; do
            az bicep build --file "$f" --outfile ".trivy-scan/arm/$(basename "$f" .bicep).json"
          done
      - name: Trivy scan (dependencies, secrets, misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, immutable release
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true # without it the SARIF report ignores the severity filter
          cache-dir: ${{ runner.temp }}/trivy # outside the scanned tree
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      # Forked PRs get a read-only token and can't upload; their results stay in the job log.
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-results.sarif') != '' && !github.event.pull_request.head.repo.fork
        with:
          sarif_file: trivy-results.sarif
          category: trivy-repo

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: # the same builds as azure.yaml: context and Dockerfile per service
          - { service: api, context: ., dockerfile: services/api/Dockerfile }
          - { service: ingest, context: ., dockerfile: services/ingest/Dockerfile }
          - { service: web, context: web, dockerfile: web/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the ${{ matrix.service }} image (not pushed)
        run: docker build -t "crq-${{ matrix.service }}:scan" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, immutable release
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: crq-${{ matrix.service }}:scan
          scanners: vuln,secret
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true # report what an update can fix
          cache-dir: ${{ runner.temp }}/trivy
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-image.sarif') != '' && !github.event.pull_request.head.repo.fork
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}
