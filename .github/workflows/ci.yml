name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: CRQ_OFFLINE=1 pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
  # The images as Azure runs them: built the way azure.yaml builds them, then started and probed, so a Dockerfile
  # change (non-root user, base image, nginx config) can't break a deploy unnoticed.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build
        run: |
          docker build -q -t crq-api -f services/api/Dockerfile .
          docker build -q -t crq-ingest -f services/ingest/Dockerfile .
          docker build -q -t crq-web web
      - name: Python images run as non-root and import their entry points
        run: |
          for img in crq-api crq-ingest; do
            uid=$(docker run --rm --entrypoint id "$img" -u)
            echo "$img uid=$uid"; test "$uid" != 0
          done
          docker run --rm -e CRQ_OFFLINE=1 --entrypoint python crq-api -c "import api.main; from pathlib import Path; assert Path('data/reference/match-042.jsonl').exists()"
          docker run --rm -e CRQ_OFFLINE=1 --entrypoint python crq-ingest -c "import ingest.consumer"
          # pip is removed after the build (its bundled libraries carry CVEs); the apps must not need it.
          for img in crq-api crq-ingest; do
            docker run --rm --entrypoint python "$img" -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('pip') is not None)"
          done
      - name: API image serves health and the bundled replay
        run: |
          docker run -d --name api -e CRQ_OFFLINE=1 -p 8000:8000 crq-api
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"file":"/etc/passwd"}' localhost:8000/matches/replay)" = 422
      - name: Web image runs as non-root, serves the app and proxies the API
        run: |
          docker network create crq
          docker network connect crq api
          docker run -d --name web --network crq -e API_UPSTREAM=http://api:8000 -p 8080:8080 crq-web
          for i in $(seq 1 30); do curl -fs localhost:8080/ >/dev/null && break; sleep 1; done
          test "$(docker exec web id -u)" != 0
          for path in / /operator /viewer /multiview; do
            test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080$path)" = 200 || { echo "FAIL $path"; exit 1; }
          done
          curl -fs localhost:8080/healthz | grep -q '"ok"'
          asset=$(curl -fs localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fs -H 'Accept-Encoding: gzip' -o /dev/null -D - "localhost:8080$asset" | grep -iq 'content-encoding: gzip'
      - name: Logs on failure
        if: failure()
        run: docker logs api || true; docker logs web || true
