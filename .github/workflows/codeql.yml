name: codeql
# GitHub code scanning (free on public repositories). Results appear under Security > Code scanning.
# `actions` analyses the workflow files themselves (unsafe triggers, script injection).
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, so new queries run against unchanged code
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      # Actions are pinned to full commit SHAs, never tags: a tag can be moved to other code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
