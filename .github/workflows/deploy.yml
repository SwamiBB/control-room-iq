name: deploy
# Manual only until the Azure sandbox is ready (issue #5). To deploy on merge again, restore:
#   push: { branches: [main], paths: [services/**, web/**, infra/**, packages/**] }
on:
  workflow_dispatch:
permissions: { id-token: write, contents: read }
jobs:
  azd:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: poc
      AZURE_LOCATION: eastus2
    steps:
      - name: Check Azure variables are set
        # Without them azd auth login stalls instead of failing.
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then echo "::error::Repository variable $name is not set (see issue #5)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
      - run: azd provision --no-prompt
      - run: azd deploy --no-prompt
